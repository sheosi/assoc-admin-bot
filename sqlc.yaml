version: "2"
plugins:
    - name: sqlc-gen-rust
      wasm:
          url: https://github.com/tunamaguro/sqlc-gen-rust/releases/download/v0.1.11/sqlc-gen-rust.wasm
          sha256: 2244c61f00ee1daaa8bbf55478609bf9f5b4a4e1b4d9178b61ca1c101f58ee6a
sql:
    - schema: "src/db_schema/schema.sql"
      queries: "src/db_schema/query.sql"
      engine: "sqlite" # Explicitly tells sqlc to use SQLite's parser
      codegen:
          - plugin: sqlc-gen-rust
            out: src/
            options:
                db_crate: "rusqlite"
